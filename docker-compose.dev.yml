services:
  # MariaDB Database - Development
  database:
    image: mariadb:11.2
    container_name: forum-database-dev
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpass123
      MYSQL_DATABASE: forumdb
      MYSQL_USER: forumuser
      MYSQL_PASSWORD: forumpass123
    ports:
      - "3306:3306"
    volumes:
      - mariadb_data_dev:/var/lib/mysql
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - forum-network
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  forum-network:
    driver: bridge

volumes:
  mariadb_data_dev:

