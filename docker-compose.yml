services:
  # MariaDB Database
  database:
    image: mariadb:11.2
    container_name: forum-database
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpass123
      MYSQL_DATABASE: forumdb
      MYSQL_USER: forumuser
      MYSQL_PASSWORD: forumpass123
    ports:
      - "3306:3306"
    volumes:
      - mariadb_data:/var/lib/mysql
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - forum-network
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Go Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: forum-backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      PORT: 8080
      ENVIRONMENT: development
      DB_HOST: database
      DB_PORT: 3306
      DB_USER: forumuser
      DB_PASSWORD: forumpass123
      DB_NAME: forumdb
      JWT_SECRET: your-super-secret-jwt-key-change-this-in-production
      JWT_ACCESS_TOKEN_EXPIRE_MINUTES: 15
      JWT_REFRESH_TOKEN_EXPIRE_DAYS: 7
      CORS_ALLOWED_ORIGINS: http://localhost:3000
    depends_on:
      database:
        condition: service_healthy
    networks:
      - forum-network

  # React Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: forum-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - forum-network

networks:
  forum-network:
    driver: bridge

volumes:
  mariadb_data:

